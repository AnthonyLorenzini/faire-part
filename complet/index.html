<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Élodie &amp; Anthony</title>
<meta name="description" content="Faire-part de mariage d'Élodie et Anthony — samedi 14 août 2027, Domaine des 4 Étangs.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#e8eeed">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --silk:#e6ecea; --paper:#f6f5f2; --ink:#1d1a1b; --wine:#7b2a22; --frame:#231f20;
  /* taille commune de l'enveloppe et des pages (rapport 1414 × 2000) */
  --cw:min(96vw,560px,calc((100dvh - 200px) * .7071));
  --ch:calc(var(--cw) * 1.41443);
  --hf:calc(var(--ch) * .2495);           /* hauteur du rabat */
  --nb:16;                                /* nombre de bandes du rabat souple */
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--silk) url(img/bg.webp) center/cover fixed;color:var(--ink);
  font-family:"Cormorant Garamond",Georgia,serif;min-height:100dvh;overflow:hidden}
img{display:block}
button{font:inherit;color:inherit}

#preview-bar{position:fixed;inset:0 0 auto 0;z-index:60;background:#231f20;color:#f6f5f2;
  font:500 13px/1.3 system-ui,sans-serif;text-align:center;padding:6px 10px;padding-top:calc(6px + env(safe-area-inset-top,0px));letter-spacing:.02em}
#preview-bar[hidden]{display:none}

/* ================= ENVELOPPE ================= */
#intro{position:fixed;inset:0;z-index:30;background:var(--silk) url(img/bg.webp) center/cover;transition:opacity .45s ease}
#intro.gone{opacity:0;pointer-events:none}
#intro.dead{display:none}
.stage{position:absolute;left:50%;top:50%;width:var(--cw);height:var(--ch);transform:translate(-50%,-50%);
  perspective:calc(var(--cw) * 2.4);perspective-origin:50% 28%;border-radius:3px;
  box-shadow:0 18px 50px rgba(40,50,48,.28),0 2px 8px rgba(40,50,48,.18)}
.stage .L{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;border-radius:3px}
.inside{z-index:2;opacity:0;clip-path:polygon(12.731% 28.1%,86.633% 28.1%,86.633% 30.9%,50.071% 53.35%,12.731% 30.9%);
  background:linear-gradient(180deg,#cfc5ab 0%,#e1d9c3 38%,#ece6d4 100%)}
.pocket{z-index:6;clip-path:polygon(12.731% 30.9%,50.071% 53.35%,86.633% 30.9%,86.633% 64%,12.731% 64%)}
.stage .deco{position:absolute;pointer-events:none;left:6.435%;top:18.05%;width:25.601%;height:30.55%;z-index:8}
.cliq{z-index:9;position:absolute;left:36.14%;top:66.65%;width:27.72%;height:2.65%;pointer-events:none;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* --- rabat souple : une pile de bandes articulées (chacune tourne un peu plus que la précédente) --- */
.flap{z-index:7;position:absolute;left:12.731%;top:28.4%;width:73.903%;height:24.95%;
  transform-style:preserve-3d;pointer-events:none}
.band{position:absolute;left:0;top:0;width:100%;height:calc(var(--hf) / var(--nb) + 1.5px);transform-origin:50% 0;will-change:transform,filter}
.band .bf,.band .bk{position:absolute;inset:0;background-repeat:no-repeat;background-size:100% var(--hf);
  background-position:0 calc(var(--hf) / var(--nb) * var(--i) * -1)}
.band .bf{background-image:url(img/flap_front.webp)}
.band .bk{display:none;background-image:url(img/flap_back.webp)}
.band.rev .bf{display:none}.band.rev .bk{display:block}
/* --- sceau de cire : deux pièces qui se séparent le long du pli du rabat --- */
.sealD{position:absolute;pointer-events:none;z-index:8;left:41.581%;top:45.449%;width:16.836%;height:12.25%;transform-origin:50% 25%}
.sfx{position:absolute;inset:0;filter:drop-shadow(0 2px 3px rgba(60,10,10,.32))}
.sfx img{position:absolute;inset:0;width:100%;height:100%;max-width:none}
.sealD.idle{animation:breatheD 3.2s ease-in-out infinite}
@keyframes breatheD{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
/* après la cassure, la moitié haute du sceau fait partie de la face extérieure du rabat (elle épouse sa courbure) */
.flap{--seal-up:linear-gradient(transparent,transparent)}
.flap.cracked .band .bf{
  background-image:var(--seal-up),url(img/flap_front.webp);
  background-size:calc(var(--cw) * .16836) calc(var(--ch) * .1225),100% var(--hf);
  background-position:calc(var(--cw) * .2885) calc(var(--ch) * .17049 - var(--hf) / var(--nb) * var(--i)),0 calc(var(--hf) / var(--nb) * var(--i) * -1)}
#crumbs{position:absolute;inset:0;z-index:10;pointer-events:none}
.crumb{position:absolute;opacity:0;will-change:transform}

.letter{z-index:5;position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:50% 50%;opacity:0;pointer-events:none;
  border-radius:3px;filter:drop-shadow(0 8px 16px rgba(40,30,20,.35));will-change:transform}
.hit{position:absolute;inset:0;z-index:20;background:none;border:0;padding:0;cursor:pointer;border-radius:3px;-webkit-tap-highlight-color:transparent}
.hit:focus-visible{outline:2px dotted var(--wine);outline-offset:6px}
.hit[disabled]{cursor:default}

/* ================= LIVRE ================= */
#book{position:fixed;inset:0;z-index:10}
.deck{position:absolute;left:50%;top:50%;width:var(--cw);height:var(--ch);transform:translate(-50%,-50%);
  perspective:calc(var(--cw) * 3);perspective-origin:20% 50%}
/* l'ombre du « carton » reste en place quand une page se lève */
.deck::before{content:"";position:absolute;inset:0;border-radius:3px;background:var(--paper);
  box-shadow:0 14px 40px rgba(40,50,48,.24),0 2px 6px rgba(40,50,48,.16)}
.pg{position:absolute;inset:0;display:none;container-type:inline-size;border-radius:3px;background:var(--paper);
  transform-origin:0 50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  touch-action:pan-y pinch-zoom;user-select:none;-webkit-user-select:none}
.pg>img.bg{position:absolute;inset:0;width:100%;height:100%;border-radius:3px}
.pg.cur{display:block;z-index:2}
.pg.nxt{display:block;z-index:1}
.pg.out{display:block;z-index:3;animation:flipOut .95s cubic-bezier(.5,.06,.3,1) forwards}
.pg.prv{display:block;z-index:4;animation:flipIn .95s cubic-bezier(.3,.06,.5,1) forwards}
@keyframes flipOut{0%{transform:rotateY(0);filter:brightness(1)}55%{filter:brightness(.86)}100%{transform:rotateY(-98deg);filter:brightness(.62);opacity:0}}
@keyframes flipIn{0%{transform:rotateY(-98deg);filter:brightness(.62);opacity:0}14%{opacity:1}100%{transform:rotateY(0);filter:brightness(1);opacity:1}}
.pg.nxt::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:3px;
  background:linear-gradient(90deg,rgba(20,15,10,.5),rgba(20,15,10,0) 75%);animation:unshade .95s ease forwards}
@keyframes unshade{to{opacity:0}}
.pg[data-turn="1"]{cursor:pointer}

/* page qui se tourne : dessinée en WebGL par-dessus le livre */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:8;pointer-events:none;display:none}
#fx.on{display:block}

#nav{position:absolute;left:50%;top:calc(50% + var(--ch) / 2 + 10px);transform:translateX(-50%);
  display:flex;align-items:center;gap:14px;z-index:5}
#nav .arrow{width:46px;height:46px;border-radius:50%;border:1px solid var(--ink);background:rgba(246,245,242,.72);
  font-size:26px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0 0 3px;transition:transform .15s,opacity .2s}
#nav .arrow:active{transform:scale(.94)}
#nav .arrow[disabled]{opacity:.28;cursor:default}
#nav .arrow:focus-visible{outline:2px dotted var(--wine);outline-offset:3px}
#dots{display:flex;gap:9px}
#dots i{width:8px;height:8px;border-radius:50%;background:rgba(29,26,27,.28);transition:background .3s,transform .3s}
#dots i.on{background:var(--wine);transform:scale(1.35)}
#hint{position:absolute;left:50%;top:calc(50% + var(--ch) / 2 + 62px);transform:translateX(-50%);
  font:400 26px/1 Allura,"Snell Roundhand",cursive;white-space:nowrap;text-align:center;transition:opacity .5s;color:var(--ink)}

/* ================= QUESTIONNAIRE ================= */
.hs{position:absolute;padding:0;margin:0;border:0;background:none;cursor:pointer;
  -webkit-tap-highlight-color:transparent;border-radius:14px}
.hs:focus-visible{outline:2px dotted var(--wine);outline-offset:-2px}
.hs svg{position:absolute;inset:-6% -4%;width:108%;height:112%;overflow:visible;pointer-events:none}
.hs path{fill:none;stroke:var(--wine);stroke-width:2.4px;stroke-linecap:round;vector-effect:non-scaling-stroke;
  stroke-dasharray:1;stroke-dashoffset:1;opacity:0;transition:stroke-dashoffset .55s ease,opacity .2s}
@media (hover:hover){.hs:hover path{stroke-dashoffset:.55;opacity:.35}}
.hs.on path{stroke-dashoffset:0;opacity:1}
.hs[data-k="present_non"]{transition:left .42s cubic-bezier(.34,1.56,.64,1),top .42s cubic-bezier(.34,1.56,.64,1)}
.hs .word{position:absolute;pointer-events:none}
.quip{position:absolute;left:50%;bottom:92%;transform:translateX(-50%) scale(.8);white-space:nowrap;pointer-events:none;opacity:0;
  font:400 4.8cqw/1 Allura,"Snell Roundhand",cursive;color:var(--wine)}
.quip.on{animation:quip 1.7s ease forwards}
@keyframes quip{0%{opacity:0;transform:translateX(-50%) scale(.7)}12%{opacity:1;transform:translateX(-50%) scale(1.05)}
  22%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-10%) scale(1)}}
.spr{position:absolute;pointer-events:none;transition:opacity .3s;animation:nudge 2.2s ease-in-out infinite}
.spr.off{opacity:0;animation:none}
@keyframes nudge{0%,100%{opacity:.6}50%{opacity:1}}
.veil{position:absolute;background:rgba(247,246,243,.66);cursor:not-allowed;opacity:0;pointer-events:none;transition:opacity .35s}
.veil.on{opacity:1;pointer-events:auto}
.fld{position:absolute;display:flex;align-items:center;justify-content:center;pointer-events:none}
.fld.sm span{font-size:4.4cqw}
.fld span{font-family:Allura,"Snell Roundhand",cursive;font-size:5.4cqw;line-height:1.15;color:var(--ink);
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 .6cqw}
.note{position:absolute;display:grid;place-items:center;pointer-events:none;opacity:0;transform:rotate(-4deg) scale(.7);
  transition:opacity .4s ease,transform .5s cubic-bezier(.3,1.5,.5,1);text-align:center;white-space:nowrap;
  font:400 4cqw/1 Allura,"Snell Roundhand",cursive;color:var(--wine)}
.note.on{opacity:1;transform:rotate(-4deg) scale(1)}
/* champs écrits à la main : pas de cercle autour */
.hs[data-k="enf_nb"] svg,.hs[data-k="allergies"] svg,.hs[data-k="moy"] svg{display:none}
.hs[data-k="moy"]{pointer-events:none}

/* ================= DISQUE (page 1) ================= */
.rec,.ivy{position:absolute;pointer-events:none;user-select:none}
.rec{will-change:transform}

/* ================= CONFIRMATION (vin d'honneur) ================= */
.rsvp-txt{position:absolute;display:grid;place-items:center;text-align:center;pointer-events:none;
  font:400 4.2cqw/1.04 Allura,"Snell Roundhand",cursive;color:var(--ink);white-space:nowrap}
.hs.rs{border:1.5px solid var(--wine);border-radius:99px;background:rgba(255,255,255,.35);
  font:600 4cqw/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.22em;text-indent:.22em;color:var(--wine);
  transition:background .25s,color .25s,transform .15s}
.hs.rs svg{display:none}
.hs.rs::after{content:"";position:absolute;inset:-10px}
@media (hover:hover){.hs.rs:hover{background:rgba(123,42,34,.12)}}
.hs.rs:active{transform:scale(.97)}
.hs.rs.on{background:var(--wine);color:#fff9f4}

/* ================= SON ================= */
#snd{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:calc(46px + env(safe-area-inset-top,0px));z-index:6;width:44px;height:44px;border-radius:50%;
  border:1px solid var(--ink);background:rgba(246,245,242,.78);cursor:pointer;display:grid;place-items:center;padding:0;transition:transform .15s,opacity .3s}
#snd[hidden]{display:none}
#snd:active{transform:scale(.94)}
#snd svg{width:24px;height:24px;fill:var(--ink);stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#snd .wv{fill:none}
#snd .x{fill:none;display:none}
#snd.off .wv{display:none}
#snd.off .x{display:inline}

/* ================= DERNIÈRE PAGE ================= */
.pg.form{background:var(--silk) url(img/bg.webp) center/cover}
.formwrap{position:absolute;inset:0;display:grid;place-items:center;padding:6cqw;overflow:auto}
.paper{width:100%;background:var(--paper);padding:20px 18px 24px;border:7px solid var(--frame);outline:1px solid var(--frame);outline-offset:3px;
  text-align:center;box-shadow:0 10px 30px rgba(40,50,48,.2)}
.paper h2{font:400 34px/1 Allura,cursive;margin:0 0 4px}
.paper .lead{margin:0 0 8px;font-size:17px;opacity:.85}
.paper label{display:block;font-family:Allura,cursive;font-size:26px;margin:10px 0 4px}
.paper input,.paper textarea,dialog input,dialog textarea{width:100%;font:500 18px/1.3 "Cormorant Garamond",Georgia,serif;
  color:var(--ink);background:#fff;border:1px solid #9a9391;border-radius:2px;padding:9px 11px;text-align:center}
.paper textarea,dialog textarea{resize:none;min-height:70px;text-align:left}
.paper input:focus,.paper textarea:focus,dialog input:focus,dialog textarea:focus{outline:2px solid var(--wine);outline-offset:1px}
.btn{display:inline-block;background:var(--wine);color:#fff;border:0;border-radius:2px;cursor:pointer;
  font:600 16px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.18em;text-transform:uppercase;padding:14px 22px;margin-top:14px;
  box-shadow:0 4px 14px rgba(123,42,34,.35);transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.6;cursor:wait}
.btn.ghost{background:none;color:var(--ink);box-shadow:none;border:1px solid var(--ink);margin-left:8px}
#status{min-height:1.3em;margin:10px 0 0;font-size:17px;line-height:1.25}
#status.err{color:#9b1c1c;font-weight:600}
.small{font-size:16px;opacity:.85}

dialog{border:7px solid var(--frame);outline:1px solid var(--frame);outline-offset:3px;background:var(--paper);color:var(--ink);
  padding:22px 20px 24px;width:min(92vw,420px);text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(30,26,27,.42);backdrop-filter:blur(3px)}
dialog h2{font:400 34px/1.1 Allura,cursive;margin:0 0 12px}
dialog p{margin:0 0 12px;font-size:18px}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin:6px 0 4px}
.stepper button{width:48px;height:48px;border-radius:50%;border:1px solid var(--ink);background:#fff;font-size:26px;cursor:pointer;line-height:1}
.stepper output{font:400 52px/1 Allura,cursive;min-width:60px}
.chips{margin:10px 0 0}
.chip{background:none;border:1px solid var(--wine);color:var(--wine);border-radius:99px;padding:6px 14px;margin:3px;cursor:pointer;font:500 16px "Cormorant Garamond",serif}
.opts{display:grid;gap:9px}
.opt{display:flex;flex-direction:column;align-items:center;gap:1px;padding:11px 12px;border:1px solid #8c8583;background:#fff;
  cursor:pointer;font:600 19px/1.15 "Cormorant Garamond",serif;border-radius:2px;position:relative;transition:background .2s,border-color .2s}
.opt small{font-weight:500;font-size:15px;opacity:.75}
.opt[aria-pressed="true"]{background:#f3e3df;border-color:var(--wine)}
.opt[aria-pressed="true"]::after{content:"✓";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--wine);font-size:22px}
.row{margin-top:14px}
.hello{font:400 44px/1.05 Allura,cursive;margin:0 0 10px}

@media (prefers-reduced-motion:reduce){
  .pg.out,.pg.prv{animation-duration:.01s}.pg.nxt::after{animation-duration:.01s}
  .cliq,.sealD.idle,.spr{animation:none}
  .hs path{transition:none}
}
</style>
<div id="preview-bar" hidden>Aperçu — les réponses ne sont pas encore envoyées (elles restent sur cet appareil)</div>

<!-- ============ ENVELOPPE ============ -->
<section id="intro" aria-label="Faire-part de mariage">
  <div class="stage" id="stage">
    <img class="L base" src="img/p1b.webp" width="1414" height="2000" alt="">
    <div class="L inside" id="inside"></div>

    <div class="flap" id="flap"></div><!-- bandes du rabat ajoutées par le script -->

    <img class="letter" id="letter" src="img/p2c.webp" width="1414" height="2000" alt="">
    <img class="L pocket" id="pocket" src="img/p1b.webp" alt="">
    <div class="sealD idle" id="sealD"><div class="sfx"><img id="sealDimg" src="img/seal.webp" alt=""></div></div>
    <div id="crumbs"></div>
    <img class="deco" id="deco" src="img/deco.webp" alt="">
    <img class="cliq" id="cliq" src="img/cliquez.webp" alt="">
    <button class="hit" id="env" type="button" aria-label="Ouvrir le faire-part d'Élodie et Anthony. Cliquez ici."></button>
  </div>
</section>

<!-- ============ LIVRE ============ -->
<div id="book" hidden>
  <div class="deck" id="deck">
    <!-- data-v : les pages qui font partie de chaque version (complet = repas + soirée ; vin = vin d'honneur seul) -->
    <section class="pg" id="p0" data-v="complet vin" data-live="1" data-turn="1"><img class="bg" src="img/p2c.webp" width="1414" height="2000" alt="Élodie et Anthony se marient le samedi 14 août 2027 au Domaine des 4 Étangs, à Ménil-sur-Belvitte (88). Cérémonie laïque à 16h."></section>
    <section class="pg" data-v="vin" data-turn="1"><img class="bg" data-src="img/p3.webp" width="1414" height="2000" alt="Vin d'honneur à la suite de la cérémonie. Dress code : la classe à l'italienne."></section>
    <section class="pg" data-v="complet" data-turn="1"><img class="bg" data-src="img/p4.webp" width="1414" height="2000" alt="Repas de mariage : un dîner savoureux, de la musique et des rires. Dress code : la classe à l'italienne."></section>
    <section class="pg" data-v="complet" data-turn="1"><img class="bg" data-src="img/p5.webp" width="1414" height="2000" alt="Merci de confirmer votre présence avant le 1er février 2027 et de répondre au questionnaire."></section>

    <section class="pg quest" id="quest" data-v="complet" data-live="1" data-turn="0" aria-label="Questionnaire">
      <img class="bg" data-src="img/p6e.webp" width="1414" height="2000" alt="">
    </section>

    <section class="pg rsvp" id="rsvp" data-v="vin" data-live="1" data-turn="0" aria-label="Confirmation de présence">
      <img class="bg" data-src="img/p5v.webp" width="1414" height="2000" alt="Merci de confirmer votre présence avant le 1er février 2027 en cliquant sur un des boutons ci-dessous.">
    </section>

    <section class="pg form" data-v="complet vin" data-turn="0" aria-label="Envoi des réponses">
      <div class="formwrap">
        <div class="paper">
          <h2>Pour finir</h2>
          <p class="lead">Dites-nous qui répond.</p>
          <label for="nom">Vos prénom(s) et nom(s)</label>
          <input id="nom" autocomplete="name" maxlength="120" placeholder="Ex. Marie et Paul Dupont">
          <label for="msg">Un petit mot ? <span class="small">(facultatif)</span></label>
          <textarea id="msg" maxlength="500" placeholder="Un souvenir, une chanson à danser…"></textarea>
          <button class="btn" id="send" type="button">Envoyer mes réponses</button>
          <p id="status" role="status" aria-live="polite"></p>
        </div>
      </div>
    </section>
  </div>

  <canvas id="fx" aria-hidden="true"></canvas>

  <nav id="nav" aria-label="Pages">
    <button class="arrow" id="prev" type="button" aria-label="Page précédente">‹</button>
    <div id="dots" aria-hidden="true"></div>
    <button class="arrow" id="next" type="button" aria-label="Page suivante">›</button>
  </nav>
  <div id="hint"></div>
  <button id="snd" type="button" aria-label="Couper la musique" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path class="sp" d="M4 9.5v5h3.6L12 18.5v-13L7.6 9.5z"/><path class="wv" d="M15 9.2a4 4 0 0 1 0 5.6M17.4 6.8a7.4 7.4 0 0 1 0 10.4"/><path class="x" d="M15.2 9.6l5 4.8M20.2 9.6l-5 4.8"/></svg>
  </button>
</div>
<audio id="music" loop preload="auto" src="audio/musique.mp3"></audio>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h2 id="dlgTitle"></h2>
    <div id="dlgBody"></div>
    <div class="row">
      <button class="btn" value="ok" id="dlgOk" type="submit">Valider</button>
      <button class="btn ghost" value="cancel" type="button" id="dlgCancel">Annuler</button>
    </div>
  </form>
</dialog>

<dialog id="thanks">
  <p class="hello" id="thanksTitle">Merci&nbsp;!</p>
  <p id="thanksText"></p>
  <div class="row"><button class="btn ghost" id="thanksEdit" type="button" style="margin-left:0">Modifier mes réponses</button></div>
</dialog>

<script>
/* ============ RÉGLAGES ============ */
const CONFIG = {
  // Adresse du script Google (voir collecte-google-apps-script.gs). Vide = mode aperçu.

/* courbe de Bézier façon CSS (peut dépasser 1 : petit rebond) */
function bez(x1,y1,x2,y2){
  const cx=3*x1, bx=3*(x2-x1)-cx, ax=1-cx-bx, cy=3*y1, by=3*(y2-y1)-cy, ay=1-cy-by;
  const X=t=>((ax*t+bx)*t+cx)*t, Y=t=>((ay*t+by)*t+cy)*t, dX=t=>(3*ax*t+2*bx)*t+cx;
  return x=>{
    if(x<=0) return 0; if(x>=1) return 1;
    let t=x;
    for(let i=0;i<8;i++){ const d=X(t)-x; if(Math.abs(d)<1e-5) break; const s=dX(t); if(Math.abs(s)<1e-6) break; t-=d/s; }
    if(t<0||t>1){ let lo=0,hi=1; t=x; for(let i=0;i<24;i++){ if(X(t)<x) lo=t; else hi=t; t=(lo+hi)/2; } }
    return Y(t);
  };
}
const smooth = (a,b,x) => { const t=clamp((x-a)/(b-a)); return t*t*(3-2*t); };

/* ============================================================
   OUVERTURE DE L'ENVELOPPE
   Sceau qui se casse le long du pli, rabat souple qui se lève puis retombe,
   lettre qui glisse hors de l'enveloppe en se balançant légèrement.
   ============================================================ */
const T = { press:[0,320], flap:[300,1550], letterIn:[1300,1500], rise:[1350,2400], zoom:[2400,3550] };
const TOTAL = 3550;
const seg = (ms,[a,b]) => clamp((ms-a)/(b-a));
const eFlap = bez(.52,0,.3,1.17);    /* démarre doucement, retombe avec un léger rebond */
const eRise = bez(.32,0,.18,1);
const eZoom = bez(.55,0,.18,1);
const eo    = t => 1-Math.pow(1-t,3);

const el = { flap:$("#flap"), inside:$("#inside"), sealD:$("#sealD"), letter:$("#letter"), cliq:$("#cliq"), deco:$("#deco"), crumbs:$("#crumbs") };

/* --- le rabat : NB bandes articulées (chacune avec sa propre matrice, une seule face à la fois) --- */
const NB = 16;
const bands = [];
(function buildFlap(){
  for(let i=0;i<NB;i++){
    const b = document.createElement("div"); b.className="band"; b.style.setProperty("--i",i);
    b.innerHTML = '<div class="bf"></div><div class="bk"></div>';
    el.flap.appendChild(b);
    bands.push({ el:b });
  }
})();

/* --- le sceau : cassure en dents de scie le long du pli du rabat --- */
const rnd = (()=>{ let s=20270814; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; })();
const vLine = u => .232 + .413*(1-Math.abs(2*u-1));                   /* le pli du rabat, dans le repère du sceau (0..1) */
const jag = [];
for(let i=0;i<=16;i++){ const u=i/16; jag.push([u, vLine(u) + (i===0||i===16 ? 0 : (i%2?1:-1)*(.012+.022*rnd()))]); }
const pc = n => (n*100).toFixed(2)+"%";
const polyLower = "polygon("+jag.map(([u,v])=>`${pc(u)} ${pc(v)}`).join(",")+",100% 100%,0 100%)";
const polyUpper = "polygon(0 0,100% 0,"+jag.slice().reverse().map(([u,v])=>`${pc(u)} ${pc(v+.022)}`).join(",")+")";   /* dépasse un peu sous l'autre pièce */
const sealDimg = $("#sealDimg");
/* la moitié haute du sceau est « cuite » dans une image (même cassure que la moitié basse) pour être posée sur les bandes du rabat */
(function bakeSealUpper(){
  const make = () => {
    const w=sealDimg.naturalWidth, h=sealDimg.naturalHeight; if(!w) return;
    const c=document.createElement("canvas"); c.width=w; c.height=h; const g=c.getContext("2d");
    g.beginPath(); g.moveTo(0,0); g.lineTo(w,0);
    for(const [u,v] of jag.slice().reverse()) g.lineTo(u*w,(v+.022)*h);
    g.closePath(); g.clip(); g.drawImage(sealDimg,0,0,w,h);
    c.toBlob(b=>{ if(b) el.flap.style.setProperty("--seal-up",`url(${URL.createObjectURL(b)})`); },"image/png");
  };
  if(sealDimg.complete && sealDimg.naturalWidth) make(); else sealDimg.addEventListener("load",make,{once:true});
})();

/* --- les miettes de cire --- */
const crumbs = [];
(function(){
  const cols = ["#8e2b22","#a13a2e","#6b1c17","#b24a3c","#7b2a22"];
  for(let i=0;i<11;i++){
    const u = .08+.84*rnd(), v = vLine(u);
    const sx = .41581 + u*.16836, sy = .45449 + v*.1225;
    const n = 5+Math.floor(rnd()*3), pts=[];
    for(let k=0;k<n;k++){ const a=k/n*2*Math.PI, r=.55+.45*rnd(); pts.push(`${(50+50*r*Math.cos(a)).toFixed(1)}% ${(50+50*r*Math.sin(a)).toFixed(1)}%`); }
    const d = document.createElement("i"); d.className="crumb";
    const size = .011+.017*rnd();
    d.style.cssText = `width:${size*100}%;height:${size*100/1.414}%;left:0;top:0;background:${cols[i%cols.length]};clip-path:polygon(${pts.join(",")})`;
    el.crumbs.appendChild(d);
    crumbs.push({ el:d, sx, sy, vx:(u-.5)*.55+(rnd()-.5)*.3, vy:-(.12+.38*rnd()), g:2.3+rnd()*.7, spin:(rnd()-.5)*900, t0:340+rnd()*90, life:.85+.3*rnd() });
  }
})();

function placeLetter(s,cx,cy,rot){
  /* le centre de la page (1414×2000) est amené en (cx,cy) à l'échelle s, en coordonnées de l'enveloppe */
  const tx=(cx-707)/1414*100, ty=(cy-1000)/2000*100;
  el.letter.style.transform=`translate(${tx}%,${ty}%) scale(${s}) rotate(${rot||0}deg)`;
}

function setFlap(f){
  const th = 180*f;                                              /* angle du pli */
  const fc = clamp(f);
  const bend = 36*Math.sin(2*Math.PI*fc);                        /* le bout devance au départ, traîne à l'arrivée */
  const hb = el.flap.offsetHeight / NB;                          /* hauteur d'une bande */
  let jy=0, jz=0;
  for(let i=0;i<NB;i++){
    const phi = th + bend*(i/(NB-1));
    const r = phi*Math.PI/180;
    const m = `translate3d(0,${jy.toFixed(2)}px,${jz.toFixed(2)}px) rotateX(${phi.toFixed(3)}deg)`;
    bands[i].el.style.transform = m;
    bands[i].el.classList.toggle("rev", Math.cos(r)<0);
    bands[i].el.style.filter = `brightness(${(1-.26*Math.pow(Math.max(Math.sin(r),0),1.35)).toFixed(3)})`;
    jy += hb*Math.cos(r); jz += hb*Math.sin(r);
  }
  el.flap.style.zIndex = th<90 ? "7" : "3";
}

function frame(ms){
  el.cliq.style.opacity = String(1-seg(ms,[0,260]));
  el.cliq.style.animation = ms>0 ? "none" : "";

  /* sceau : appui, tremblement, puis cassure le long du pli */
  const cracked = ms >= 320;
  el.flap.classList.toggle("cracked", cracked);
  sealDimg.style.clipPath = cracked ? polyLower : "none";
  if(ms>0) el.sealD.classList.remove("idle"); else el.sealD.style.transform="";
  if(ms>0){
    const pr = seg(ms,[0,300]);
    const press = Math.sin(Math.PI*pr);                           /* 0 → 1 → 0 */
    const sc = 1 - .05*press;
    const tremble = Math.sin(ms*.09)*1.6*press*(1-pr);
    const slump = eo(seg(ms,[320,1000]));                         /* la moitié basse s'affaisse et reste collée à l'enveloppe */
    el.sealD.style.transform = `translateY(${(slump*.9).toFixed(2)}%) rotate(${(tremble*.6 + slump*3.4).toFixed(2)}deg) scale(${sc.toFixed(4)})`;
  }
  for(const c of crumbs){
    const tau = (ms-c.t0)/1000;
    if(tau<=0){ c.el.style.opacity="0"; continue; }
    const x = c.sx + c.vx*tau, y = c.sy + c.vy*tau + .5*c.g*tau*tau;
    c.el.style.opacity = String(clamp(1-(tau-.5)/c.life) * clamp(tau*14));
    c.el.style.transform = `translate(${(x*100/(parseFloat(c.el.style.width)/100)).toFixed(1)}%,${(y*100/(parseFloat(c.el.style.height)/100)).toFixed(1)}%) rotate(${(c.spin*tau).toFixed(0)}deg)`;
  }

  /* rabat */
  const f = eFlap(seg(ms,T.flap));
  el.inside.style.opacity = String(clamp(f*14));
  setFlap(f);

  /* lettre */
  el.letter.style.opacity = String(seg(ms,T.letterIn));
  const r = eRise(seg(ms,T.rise)), z = eZoom(seg(ms,T.zoom));
  let s=.34, cx=708, cy=905, rot=0;
  if(ms>=T.zoom[0]){
    s=.46+(1-.46)*z; cx=708+(707-708)*z; cy=330+(1000-330)*z; rot=-0.9*(1-z);
  } else {
    s=.34+(.46-.34)*r; cy=905+(330-905)*r;
    cx = 708 + 9*Math.sin(r*Math.PI*1.6)*(1-r*.5);                /* léger balancement pendant qu'elle sort */
    rot = 2.2*Math.sin(r*Math.PI*1.6 + .5)*(1-r*.6) - .9*r;
  }
  placeLetter(s,cx,cy,rot);
  const front = ms>=T.zoom[0];
  el.letter.style.zIndex = front ? "15" : "5";
  el.deco.style.opacity = front ? String(1-z) : "1";
}
/* ---- musique : démarre au clic sur l'enveloppe (seul moment où le navigateur l'autorise), en fondu ---- */
const Music = (()=>{
  const a=$("#music"), b=$("#snd"); let muted=false, broken=false, fade=0, wanted=false;
  try{ muted = localStorage.getItem("fp_muted")==="1"; }catch(e){}
  const LEVEL=.5;
  a.volume=0;
  a.addEventListener("error",()=>{ broken=true; b.hidden=true; });
  function ramp(to,ms,done){ cancelAnimationFrame(fade); const v0=a.volume, t0=performance.now();
    (function st(now){ const t=clamp((now-t0)/ms); a.volume=clamp(v0+(to-v0)*t); if(t<1) fade=requestAnimationFrame(st); else if(done) done(); })(t0); }
  function paint(){ b.classList.toggle("off",muted); b.setAttribute("aria-label",muted?"Remettre la musique":"Couper la musique"); b.setAttribute("aria-pressed",String(!muted)); }
  function play(ms){ const pr=a.play(); if(pr&&pr.catch) pr.catch(()=>{}); ramp(LEVEL,ms); }
  function start(){ if(broken) return; wanted=true; b.hidden=false; paint(); if(!muted) play(4200); }
  b.addEventListener("click",()=>{
    muted=!muted; try{ localStorage.setItem("fp_muted",muted?"1":"0"); }catch(e){} paint();
    if(muted) ramp(0,350,()=>a.pause()); else play(700);
  });
  document.addEventListener("visibilitychange",()=>{ if(!wanted||muted||broken) return; if(document.hidden) a.pause(); else play(900); });
  return { start };
})();

let opened=false;
function openEnvelope(){
  if(opened) return; opened=true; $("#env").disabled=true; Music.start();
  if(reduceMotion){ finishOpen(); return; }
  const t0=performance.now();
  (function step(now){
    const ms=now-t0; frame(Math.min(ms,TOTAL));
    if(ms<TOTAL) requestAnimationFrame(step); else finishOpen();
  })(t0);
}
function finishOpen(){
  $("#book").hidden=false; Flip.init(); goTo(startPage);
  document.body.classList.remove("locked");
  $("#intro").classList.add("gone");
  setTimeout(()=>$("#intro").classList.add("dead"),500);
  updateHint(); Flip.preload();
}
placeLetter(.34,708,905,0); setFlap(0);
$("#env").addEventListener("click", openEnvelope);

/* ============================================================
   LIVRE : pages qui se plient en se tournant (WebGL)
   La page est un maillage qui s'enroule autour de la reliure : elle part du bord
   droit, se courbe, passe devant la page suivante en projetant son ombre,
   puis retombe à gauche. Si WebGL manque, on garde l'ancienne rotation CSS.
   ============================================================ */
const deck = $("#deck");
(function pickVariant(){
  const parked = document.createElement("div"); parked.hidden = true; document.body.appendChild(parked);
  [...deck.querySelectorAll(":scope > [data-v]")].forEach(sec=>{
    if(sec.dataset.v.split(" ").includes(VARIANT)){ sec.querySelectorAll("img.bg[data-src]").forEach(i=>{ i.src=i.dataset.src; }); return; }
    parked.appendChild(sec);                                                   /* les images des autres pages ne sont jamais chargées */
  });
})();
const pages = [...deck.querySelectorAll(".pg")];
let cur = 0, busy = false;
const startPage = Math.min(Math.max(parseInt(params.get("p")||"0",10)||0,0),pages.length-1);
const IMG_W=1414, IMG_H=2000;

const Flip = (()=>{
  const canvas = $("#fx");
  let gl=null, ok=false, glv=0, P=null, SP=null, vbo=null, ibo=null, nIdx=0, aniso=null;
  const NX=72, NY=8, tex=new Map(), srcVer=new Map();
  const VS = `
attribute vec2 a_uv;
uniform vec2 u_pg, u_org, u_vp, u_res;
uniform float u_f, u_th, u_k, u_tw, u_slide, u_shadow;
uniform vec3 u_L;
varying vec2 v_uv; varying vec3 v_pos; varying vec3 v_n; varying float v_h;
void main(){
  float s = a_uv.x * u_pg.x;
  float y = a_uv.y * u_pg.y;
  float k = (u_k / u_pg.x) * (1.0 + u_tw * (a_uv.y - 0.5));
  float a = 0.5 * k * s;
  float sc = abs(a) < 1e-4 ? 1.0 : sin(a) / a;
  float x = s * sc * cos(u_th + a);
  float z = s * sc * sin(u_th + a);
  float phi = u_th + k * s;
  vec3 P = vec3(u_org.x + x + u_slide, u_org.y + y, z);
  v_n = vec3(-sin(phi), 0.0, cos(phi));
  v_uv = a_uv; v_h = max(z, 0.0) / u_pg.x;
  vec3 Q = P;
  if (u_shadow > 0.5) { float h = max(P.z, 0.0); Q.xy = P.xy - u_L.xy * (h / u_L.z); Q.z = 0.0; }
  v_pos = Q;
  float d = max(u_f - Q.z, 1.0);
  vec2 scr = u_vp + (Q.xy - u_vp) * (u_f / d);
  float depth = clamp(-Q.z / (8.0 * u_pg.x), -0.95, 0.95);
  gl_Position = vec4(scr.x / u_res.x * 2.0 - 1.0, 1.0 - scr.y / u_res.y * 2.0, depth, 1.0);
}`;
  const FS = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform sampler2D u_tex; uniform vec3 u_L; uniform vec3 u_cam; uniform float u_alpha;
varying vec2 v_uv; varying vec3 v_pos; varying vec3 v_n; varying float v_h;
void main(){
  vec3 n = normalize(v_n);
  vec3 V = normalize(u_cam - v_pos);
  bool front = dot(n, V) > 0.0;
  vec3 nv = front ? n : -n;
  float lam = min(max(dot(nv, u_L), 0.0) / u_L.z, 1.05);
  float shade = 0.36 + 0.64 * lam;
  vec4 t = texture2D(u_tex, v_uv);
  vec3 col;
  if (front) col = t.rgb * shade;
  else { vec3 paper = vec3(0.958, 0.951, 0.930); col = mix(paper, paper * t.rgb, 0.16) * (0.34 + 0.66 * lam); }
  vec3 R  = reflect(-u_L, nv);
  vec3 R0 = reflect(-u_L, vec3(0.0, 0.0, 1.0));
  float sp  = pow(max(dot(R,  V), 0.0), 16.0);
  float sp0 = pow(max(dot(R0, V), 0.0), 16.0);
  col += (sp - sp0) * 0.10;
  gl_FragColor = vec4(clamp(col, 0.0, 1.0) * u_alpha, u_alpha);
}`;
  const SFS = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform float u_sh; uniform float u_alpha;
varying vec2 v_uv; varying vec3 v_pos; varying vec3 v_n; varying float v_h;
void main(){
  float soft = 0.02 + 0.16 * clamp(v_h * 1.2, 0.0, 1.0);
  float e = smoothstep(0.0, soft, v_uv.x) * smoothstep(0.0, soft, 1.0 - v_uv.x)
          * smoothstep(0.0, soft, v_uv.y) * smoothstep(0.0, soft, 1.0 - v_uv.y);
  float a = u_sh * e * (1.0 - 0.8 * smoothstep(0.0, 1.0, v_h * 1.1)) * u_alpha;
  gl_FragColor = vec4(0.10, 0.12, 0.12, 1.0) * a;
}`;

  function sh(type,src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
  function prog(fs){ const p=gl.createProgram(); gl.attachShader(p,sh(gl.VERTEX_SHADER,VS)); gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));
    gl.bindAttribLocation(p,0,"a_uv"); gl.linkProgram(p);
    if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u={}; const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
    for(let i=0;i<n;i++){ const nm=gl.getActiveUniform(p,i).name; u[nm]=gl.getUniformLocation(p,nm); }
    return {p,u}; }

  function init(){
    if(gl || ok) return ok;
    if(params.has("nogl")) return false;
    try{
      const opt={alpha:true,premultipliedAlpha:true,antialias:true,depth:true,powerPreference:"high-performance"};
      gl = canvas.getContext("webgl2",opt); glv = gl ? 2 : 1;
      if(!gl){ gl = canvas.getContext("webgl",opt); glv = gl ? 1 : 0; }
      if(!gl) return false;
      P = prog(FS); SP = prog(SFS);
      const uv=new Float32Array((NX+1)*(NY+1)*2); let k=0;
      for(let j=0;j<=NY;j++) for(let i=0;i<=NX;i++){ uv[k++]=i/NX; uv[k++]=j/NY; }
      const idx=[]; for(let j=0;j<NY;j++) for(let i=0;i<NX;i++){ const a=j*(NX+1)+i, b=a+1, c=a+NX+1, d=c+1; idx.push(a,b,c,b,d,c); }
      nIdx=idx.length;
      vbo=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,vbo); gl.bufferData(gl.ARRAY_BUFFER,uv,gl.STATIC_DRAW);
      ibo=gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ibo); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(idx),gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
      aniso = gl.getExtension("EXT_texture_filter_anisotropic");
      canvas.addEventListener("webglcontextlost",e=>{ e.preventDefault(); ok=false; tex.clear(); srcVer.clear(); });
      canvas.addEventListener("webglcontextrestored",()=>{ gl=null; ok=false; P=SP=null; Flip.init(); });
      ok = true;
    }catch(err){ console.warn("WebGL indisponible, rotation CSS :", err); gl=null; ok=false; }
    return ok;
  }

  function texFor(idx, src, ver){
    if(!ok) return null;
    let t = tex.get(idx);
    if(t && srcVer.get(idx)===ver) return t;
    if(!t){ t = gl.createTexture(); tex.set(idx,t); }
    gl.bindTexture(gl.TEXTURE_2D,t);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    if(glv===2){
      gl.generateMipmap(gl.TEXTURE_2D);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
      if(aniso) gl.texParameterf(gl.TEXTURE_2D,aniso.TEXTURE_MAX_ANISOTROPY_EXT,Math.min(8,gl.getParameter(aniso.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
    } else gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    srcVer.set(idx,ver);
    return t;
  }
  const pageImg = i => pages[i].querySelector("img.bg");
  /* prépare la texture d'une page ; la page du questionnaire est « photographiée » avec les réponses du moment */
  function prepare(idx){
    if(!ok) return false;
    try{
      const live = pages[idx].dataset.live && LIVE[pages[idx].id];
      if(live) return !!texFor(idx, live(), "L"+Date.now());
      const im = pageImg(idx);
      if(!im || !im.complete || !im.naturalWidth) return false;
      return !!texFor(idx, im, "img");
    }catch(err){ console.warn(err); return false; }
  }
  function preload(){
    if(!ok) return;
    let i=0;
    (function next(){
      while(i<pages.length && (pages[i].dataset.live || !pageImg(i))) i++;
      if(i>=pages.length) return;
      const k=i++; try{ prepare(k); }catch(e){}
      setTimeout(next,160);
    })();
  }
  function on(v){ canvas.classList.toggle("on",v); if(!v && ok){ gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT); } }

  /* pose de la page selon l'avancement e (0 = à plat sur le livre, 1 = retournée à gauche) */
  function pose(e){
    const ec = clamp(e);
    const th = Math.PI*ec;
    /* courbure : le bord libre devance au départ, puis traîne en retombant */
    const k = 0.95*Math.sin(2*Math.PI*ec) - 0.42*Math.sin(Math.PI*ec) - 0.18*Math.sin(2*Math.PI*ec)*ec;
    const tw = .55;
    const slide = -0.34*smooth(.72,1,ec);
    const alpha = 1 - smooth(.80,1,ec);
    return {th,k,tw,slide,alpha};
  }
  function draw(idx, e){
    if(!ok) return;
    const t = tex.get(idx); if(!t) return;
    const cr = canvas.getBoundingClientRect(), dr = deck.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    const w = Math.max(1,Math.round(cr.width*dpr)), h = Math.max(1,Math.round(cr.height*dpr));
    if(canvas.width!==w || canvas.height!==h){ canvas.width=w; canvas.height=h; }
    gl.viewport(0,0,w,h);
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    const W=dr.width, H=dr.height, ox=dr.left-cr.left, oy=dr.top-cr.top;
    const f=4.2*W, vp=[ox+.2*W, oy+.5*H];
    const L=[-.26,-.42,.87]; const ln=Math.hypot(...L); L[0]/=ln; L[1]/=ln; L[2]/=ln;
    const q = pose(e);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
    gl.bindBuffer(gl.ARRAY_BUFFER,vbo); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ibo);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
    const common = (pr,shadow)=>{
      gl.useProgram(pr.p); const u=pr.u;
      gl.uniform2f(u.u_pg,W,H); gl.uniform2f(u.u_org,ox,oy); gl.uniform2f(u.u_vp,vp[0],vp[1]); gl.uniform2f(u.u_res,cr.width,cr.height);
      gl.uniform1f(u.u_f,f); gl.uniform1f(u.u_th,q.th); gl.uniform1f(u.u_k,q.k); gl.uniform1f(u.u_tw,q.tw); gl.uniform1f(u.u_slide,q.slide*W);
      gl.uniform1f(u.u_shadow,shadow); gl.uniform3f(u.u_L,L[0],L[1],L[2]); gl.uniform1f(u.u_alpha,q.alpha);
    };
    /* 1) ombre portée sur le livre */
    gl.disable(gl.DEPTH_TEST);
    common(SP,1); gl.uniform1f(SP.u.u_sh,.58);
    gl.drawElements(gl.TRIANGLES,nIdx,gl.UNSIGNED_SHORT,0);
    /* 2) la page elle-même, recto puis verso selon l'orientation */
    gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL);
    common(P,0); gl.uniform3f(P.u.u_cam,vp[0],vp[1],f);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,t); gl.uniform1i(P.u.u_tex,0);
    gl.drawElements(gl.TRIANGLES,nIdx,gl.UNSIGNED_SHORT,0);
  }
  return { init, prepare, preload, draw, on, get ok(){ return ok; } };
})();

/* ---- gestion des tours de page ---- */
const dotsEl = $("#dots"); pages.forEach(()=>dotsEl.appendChild(document.createElement("i")));
function updateNav(){
  [...dotsEl.children].forEach((d,i)=>d.classList.toggle("on",i===cur));
  $("#prev").disabled = cur===0; $("#next").disabled = cur===pages.length-1;
}
let lastCur=-1;
function updateHint(){
  const h=$("#hint"), p=pages[cur];
  h.textContent = p.dataset.turn==="1" ? "Touchez ou glissez pour tourner" : p===quest ? "Touchez vos réponses sur la page" : p.id==="rsvp" ? "Touchez OUI ou NON" : "";
  if(cur!==lastCur){ lastCur=cur; if(p===quest) armJoke(); }      /* la blague du « non » rejoue à chaque arrivée sur la page */
}
function goTo(i){
  pages.forEach((p,k)=>{ p.classList.remove("nxt","out","prv"); p.classList.toggle("cur",k===i); });
  Flip.on(false); flip=null; cur=i; busy=false; updateNav(); updateHint();
}
let flip=null;      /* {dir,n,turnIdx,under,e} pendant qu'une page se tourne en WebGL */
function startFlip(dir){
  if(!Flip.ok || reduceMotion) return null;
  const n=cur+dir; if(n<0||n>=pages.length) return null;
  const turnIdx = dir>0 ? cur : n, under = dir>0 ? n : cur;
  if(!Flip.prepare(turnIdx)) return null;
  pages.forEach((p,k)=>p.classList.toggle("cur",k===under));
  Flip.on(true);
  flip = {dir,n,turnIdx,under,e:dir>0?0:1};
  Flip.draw(turnIdx,flip.e);
  return flip;
}
function setFlipE(e){ flip.e=e; Flip.draw(flip.turnIdx,e); }
function finishFlip(commit){
  const f=flip; flip=null;
  const final = commit ? f.n : cur;
  pages.forEach((p,k)=>p.classList.toggle("cur",k===final));
  Flip.on(false);
  cur=final; busy=false; updateNav(); updateHint();
}
let raf=0;
function animateE(from,to,dur,ease,done){
  const t0=performance.now();
  cancelAnimationFrame(raf);
  (function step(now){
    const t=clamp((now-t0)/dur);
    setFlipE(clamp(from+(to-from)*ease(t)));
    if(t<1) raf=requestAnimationFrame(step); else done();
  })(t0);
}
const eTurn = bez(.42,.02,.22,1);
function turnCSS(dir){      /* repli sans WebGL */
  const n=cur+dir; if(busy||n<0||n>=pages.length) return;
  busy=true;
  const a=pages[cur], b=pages[n];
  if(dir>0){ b.classList.add("nxt"); a.classList.remove("cur"); a.classList.add("out"); }
  else { b.classList.add("prv"); }
  setTimeout(()=>{ a.classList.remove("cur","out"); b.classList.remove("nxt","prv"); b.classList.add("cur"); cur=n; busy=false; updateNav(); updateHint(); }, reduceMotion?20:950);
}
function turn(dir){
  if(busy||cur+dir<0||cur+dir>=pages.length) return;
  if(reduceMotion){ goTo(cur+dir); return; }
  const f = startFlip(dir);
  if(!f){ turnCSS(dir); return; }
  busy=true;
  animateE(f.e, dir>0?1:0, 1150, eTurn, ()=>finishFlip(true));
}
$("#next").addEventListener("click",()=>turn(1));
$("#prev").addEventListener("click",()=>turn(-1));
addEventListener("keydown",e=>{
  if(document.querySelector("dialog[open]")||/INPUT|TEXTAREA/.test((e.target||{}).tagName||"")||$("#book").hidden) return;
  if(e.key==="ArrowRight") turn(1); else if(e.key==="ArrowLeft") turn(-1);
});

/* glisser pour tourner : la page suit le doigt, puis termine son mouvement */
let drag=null;
const pinched=()=>!!(window.visualViewport && visualViewport.scale>1.03);   /* page zoomée au pincement : on ne tourne plus au glissement ni au toucher */
deck.addEventListener("pointerdown",e=>{
  if(busy || e.button>0 || pinched() || e.target.closest("input,textarea,select,button")) { drag=null; return; }
  drag={x0:e.clientX,y0:e.clientY,id:e.pointerId,dir:0,samples:[[performance.now(),e.clientX]]};
});
deck.addEventListener("pointermove",e=>{
  if(!drag || e.pointerId!==drag.id) return;
  const dx=e.clientX-drag.x0, dy=e.clientY-drag.y0;
  if(!drag.dir){
    if(Math.abs(dx)<10 || Math.abs(dx)<Math.abs(dy)*1.2) return;
    if(!Flip.ok){ return; }
    const dir = dx<0 ? 1 : -1;
    if(!startFlip(dir)){ drag=null; return; }
    drag.dir=dir; busy=true;
    try{ deck.setPointerCapture(e.pointerId); }catch(_){}
  }
  const W=deck.getBoundingClientRect().width;
  const prog=clamp(Math.abs(dx)/(W*.8));
  drag.prog=prog; setFlipE(drag.dir>0 ? prog : 1-prog);
  drag.samples.push([performance.now(),e.clientX]); if(drag.samples.length>6) drag.samples.shift();
});
function endDrag(e,cancelled){
  if(!drag || e.pointerId!==drag.id) return;
  const d=drag; drag=null;
  const dx=e.clientX-d.x0, dy=e.clientY-d.y0;
  if(d.dir){
    const s=d.samples, a=s[0], b=s[s.length-1];
    const vx = b[0]>a[0] ? (b[1]-a[1])/(b[0]-a[0]) : 0;       /* px/ms */
    const flick = d.dir>0 ? vx<-.45 : vx>.45;
    const commit = !cancelled && ((d.prog||0)>.33 || flick);
    const target = d.dir>0 ? (commit?1:0) : (commit?0:1);
    const dist = Math.abs(target-flip.e);
    animateE(flip.e,target,Math.max(260,1000*dist),bez(.2,.4,.3,1),()=>finishFlip(commit));
    return;
  }
  if(cancelled || pinched()) return;
  const p=pages[cur]; if(!p) return;
  const swipe = Math.abs(dx)>45 && Math.abs(dy)<70;
  if(swipe) turn(dx<0?1:-1);                                /* repli CSS : glissement */
  else if(Math.abs(dx)<10 && Math.abs(dy)<10 && p.dataset.turn==="1") turn(1);
}
deck.addEventListener("pointerup",e=>endDrag(e,false));
deck.addEventListener("pointercancel",e=>endDrag(e,true));

function tryDodge(){

  const now=Date.now(); if(now-lastDodge<320) return true; lastDodge=now;
  moveNon(...NON_SPOTS[dodges]); quip(NON_QUIPS[dodges]); dodges++;

      if(swallow) return;
      if(dodges<99) nonHome();
      pick("present","non"); break;
    case "dort_oui":
      if(S.dort!=="oui"){ S.dort="oui"; render(); askMoyens(); return; }
      S.dort=null; S.moyens=[]; break;
    case "dort_non": pick("dort","non"); S.moyens=[]; break;
    case "moy": if(S.dort==="oui") askMoyens(); return;
    case "rs_oui": case "rs_non":

      setTimeout(()=>{ if(pages[cur]===rsvp && !busy) turn(1); },800); return;
    case "enf_oui": if(S.enfants!=="oui"){ S.enfants="oui"; render(); askNb(); return; } S.enfants=null; S.nb=null; break;

    dort_oui:S.dort==="oui", dort_non:S.dort==="non", moy:S.moyens.length>0,
    rs_oui:S.present==="oui", rs_non:S.present==="non",
    enf_oui:S.enfants==="oui", enf_non:S.enfants==="non", enf_nb:S.nb!=null,
    allergies:!!S.allergies, dessert_cafe:S.dessert==="cafe", dessert_pist:S.dessert==="pistache"
  };
}
function render(){
  const on = onState();
  for(const [k,b] of Object.entries(btn)){
    b.classList.toggle("on",!!on[k]);
    if(k!=="enf_nb" && k!=="allergies" && k!=="moy"){ b.setAttribute("role","radio"); b.setAttribute("aria-checked",String(!!on[k])); }
  }
  veil.classList.toggle("on", S.present==="non");
  btn.enf_nb.style.pointerEvents = S.enfants==="oui" ? "auto" : "none";
  btn.moy.style.pointerEvents = S.dort==="oui" ? "auto" : "none";
  fld.moy.firstChild.textContent = moyText();
  fld.enf_nb.firstChild.textContent = S.nb!=null ? String(S.nb) : "";
  fld.allergies.firstChild.textContent = S.allergies || "";
  fld.allergies.firstChild.title = S.allergies || "";
  spr.nb.classList.toggle("off", !(S.enfants==="oui" && S.nb==null));
  spr.all.classList.toggle("off", !!S.allergies);
  spr.moy.classList.toggle("off", !(S.dort==="oui" && !S.moyens.length));
  note.cafe.classList.toggle("on", S.dessert==="cafe");
  note.pistache.classList.toggle("on", S.dessert==="pistache");
  persist();
}

/* ============ fenêtres de saisie ============ */
const dlg=$("#dlg"), dlgBody=$("#dlgBody"), dlgTitle=$("#dlgTitle");
let dlgDone=null;
function openDlg(title,body,done){ dlgTitle.textContent=title; dlgBody.replaceChildren(body); dlgDone=done; dlg.showModal(); }
$("#dlgCancel").addEventListener("click",()=>{ dlgDone=null; dlg.close(); });
dlg.addEventListener("close",()=>{ if(dlg.returnValue==="ok" && dlgDone) dlgDone(); dlgDone=null; dlg.returnValue=""; });

function askMoyens(){
  const wrap=document.createElement("div");
  wrap.innerHTML='<p>Un gîte, des mobil-homes, des emplacements de tentes et de camping-cars vous attendent. <span class="small">Plusieurs choix possibles.</span></p><div class="opts">'
    +'<button type="button" class="opt" data-m="lits">Dans un lit<small>gîte ou mobil-home</small></button>'
    +'<button type="button" class="opt" data-m="tentes">En tente</button>'
    +'<button type="button" class="opt" data-m="camping">En camping-car</button></div>';
  const sel=new Set(S.moyens);
  wrap.querySelectorAll(".opt").forEach(b=>{ const m=b.dataset.m; b.setAttribute("aria-pressed",String(sel.has(m)));
    b.onclick=()=>{ sel.has(m)?sel.delete(m):sel.add(m); b.setAttribute("aria-pressed",String(sel.has(m))); }; });
  openDlg("Où dormirez-vous ?",wrap,()=>{ S.moyens=[...sel]; render(); });
}
function askNb(){
  const wrap=document.createElement("div"); const n0=S.nb||1;
  wrap.innerHTML='<p>Combien d\'enfants vous accompagnent&nbsp;?</p><div class="stepper"><button type="button" aria-label="Moins">−</button><output aria-live="polite">'+n0+'</output><button type="button" aria-label="Plus">+</button></div>';
  const out=wrap.querySelector("output"); let n=n0; const [m,p]=wrap.querySelectorAll("button");
  m.onclick=()=>{ n=Math.max(1,n-1); out.textContent=n; }; p.onclick=()=>{ n=Math.min(12,n+1); out.textContent=n; };
  openDlg("Vos enfants",wrap,()=>{ S.nb=n; render(); });
}
function askAllergies(){
  const wrap=document.createElement("div");
  wrap.innerHTML='<p>Allergie, intolérance ou régime particulier&nbsp;?</p><textarea maxlength="200" aria-label="Allergies alimentaires" placeholder="Ex. gluten, fruits à coque, végétarien…"></textarea><div class="chips"><button type="button" class="chip">Aucune allergie</button></div>';
  const ta=wrap.querySelector("textarea"); ta.value = S.allergies==="Aucune" ? "" : S.allergies;
  wrap.querySelector(".chip").onclick=()=>{ S.allergies="Aucune"; render(); dlgDone=null; dlg.close(); };
  openDlg("Allergies alimentaires",wrap,()=>{ S.allergies=ta.value.trim(); render(); });
}

/* ============ ENVOI ============ */
const nom=$("#nom"), msg=$("#msg"), status=$("#status"), send=$("#send");
nom.value=S.nom; msg.value=S.message;
nom.addEventListener("input",()=>{ S.nom=nom.value; persist(); });
msg.addEventListener("input",()=>{ S.message=msg.value; persist(); });
let warned=false;
const say=(t,err)=>{ status.textContent=t; status.classList.toggle("err",!!err); };
function missing(){
  const m=[];
  if(VARIANT==="complet" && S.present==="oui"){
    if(!S.dort) m.push("le logement");
    else if(S.dort==="oui" && !S.moyens.length) m.push("le type d'hébergement");
    if(!S.enfants) m.push("les enfants"); else if(S.enfants==="oui" && S.nb==null) m.push("leur nombre");
    if(!S.allergies) m.push("les allergies");
    if(!S.dessert) m.push("le dessert");
  }
  return m;
}
function payload(){
  const present=S.present==="oui";
  return { id:S.id, invite:VARIANT==="vin"?"Vin d'honneur":"Repas et soirée", nom:S.nom.trim(), present:S.present, message:S.message.trim(),
    dort: present?S.dort:"", moyens: present&&S.dort==="oui"?S.moyens.join(", "):"",
    enfants: present?(S.enfants||""):"", nb_enfants: present&&S.enfants==="oui"?S.nb:"",
    allergies: present?S.allergies:"", dessert: present?(S.dessert==="cafe"?"Café":S.dessert==="pistache"?"Pistache & framboise":""):"" };
}
send.addEventListener("click",async ()=>{
  if(!S.present){ say("Il manque votre réponse à « Serez-vous présent ? » : revenez à la page précédente.",true); return; }
  if(!S.nom.trim()){ say("Merci d'indiquer votre nom pour que nous sachions qui répond.",true); nom.focus(); return; }
  const miss=missing();
  if(miss.length && !warned){ warned=true; send.textContent="Envoyer quand même"; say("Il reste sans réponse : "+miss.join(", ")+".",true); return; }
  send.disabled=true; say("Envoi en cours…");
  try{
    if(CONFIG.ENDPOINT){
      /* « text/plain » = requête simple (pas de pré-vérification) ; le script répond {"ok":true} une fois la ligne inscrite dans le tableau */
      const ctl = new AbortController(), to = setTimeout(()=>ctl.abort(), 25000);
      let r; try{ r = await fetch(CONFIG.ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload()),signal:ctl.signal,redirect:"follow"}); } finally{ clearTimeout(to); }
      const j = await r.json();
      if(!j || j.ok!==true) throw new Error((j&&j.erreur)||"réponse inattendue");
    }
    S.sent=true; persist(); say(""); showThanks();
  }catch(e){ say("L'envoi n'a pas abouti. Vérifiez votre connexion et réessayez : vos réponses sont gardées.",true); }
  finally{ send.disabled=false; warned=false; send.textContent="Envoyer mes réponses"; }
});
function showThanks(){
  const prenom=S.nom.trim().split(/[\s,&]+/)[0]||"";
  $("#thanksTitle").textContent="Merci"+(prenom?" "+prenom:"")+" !";
  $("#thanksText").textContent = S.present==="oui"
    ? "Votre réponse est bien enregistrée. Nous avons hâte de vous retrouver le 14 août 2027"+(VARIANT==="vin"?" pour le vin d'honneur.":".")
    : "Votre réponse est bien enregistrée. Vous nous manquerez, mais merci de nous l'avoir dit.";
  $("#thanks").showModal();
}
$("#thanksEdit").addEventListener("click",()=>$("#thanks").close());

/* ---- le disque de la 1re page : tout le vinyle (avec la tête du chat) tourne à 15 tours/min ;
        polaroïd, fleurs, lierre et dentelle restent fixes par-dessus ---- */
const Rec = (()=>{
  const sec=$("#p0"), C=[381.8,675.4], H=296, PERIOD=4000;
  const mkImg = (cls,src)=>{ const i=document.createElement("img"); i.className=cls; i.alt=""; i.draggable=false; i.src=src; place(i,[C[0]-H,C[1]-H,2*H,2*H]); sec.appendChild(i); return i; };
  const disc = mkImg("rec","img/disc.webp"), fore = mkImg("ivy","img/fore.webp");
  let t0 = null, angle = 0;                   /* la rotation part de 0° quand la page apparaît, comme sur l'image de l'enveloppe */
  function tick(now){
    requestAnimationFrame(tick);
    if(reduceMotion || document.hidden || !sec.classList.contains("cur")){ t0 = null; return; }
    if(t0===null) t0 = now - angle/360*PERIOD;
    angle = ((now-t0) % PERIOD) / PERIOD * 360;
    disc.style.transform = `rotate(${angle.toFixed(2)}deg)`;
  }
  requestAnimationFrame(tick);
  function snapshot(){                       /* image de la page 1 avec le disque dans sa position du moment */
    const c=document.createElement("canvas"); c.width=IMG_W; c.height=IMG_H; const g=c.getContext("2d");
    g.drawImage(sec.querySelector("img.bg"),0,0,IMG_W,IMG_H);
    if(disc.complete && disc.naturalWidth){
      g.save(); g.translate(C[0],C[1]); g.rotate(angle*Math.PI/180); g.drawImage(disc,-H,-H,2*H,2*H); g.restore();
      if(fore.complete && fore.naturalWidth) g.drawImage(fore,C[0]-H,C[1]-H,2*H,2*H);
    }
    return c;
  }
  return { snapshot, get angle(){ return angle; } };
})();

render();
/* pour tester : ?skip ouvre directement le livre, ?p=4 va à la page voulue, ?nogl force le repli CSS */
if(params.has("skip")){ opened=true; $("#intro").classList.add("dead"); $("#book").hidden=false; Flip.init(); document.body.classList.remove("locked"); goTo(startPage); Flip.preload(); }
window.__fp = { frame, goTo, turn, S:()=>S, Flip, Rec, VARIANT, pages:()=>pages,
  /* aperçu figé d'une page en train de se tourner (tests) */
  pose:(turnIdx,e)=>{ if(!Flip.ok) return false; cur=turnIdx; pages.forEach((p,k)=>p.classList.toggle("cur",k===turnIdx+1));
    Flip.prepare(turnIdx); Flip.on(true); Flip.draw(turnIdx,e); return true; } };
